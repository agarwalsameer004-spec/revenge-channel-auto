name: Publish YouTube Video

on:
  schedule:
    # 2x/week (Tue + Fri, 10:00 UTC). Deliberately not higher: the constraint
    # is script research, not quota. Growing the channel beats flooding it.
    - cron: '0 10 * * 2,5'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A ~17-minute video takes roughly 45 min to render on a 2-core runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        # fonts-dejavu is required for burned-in captions and the thumbnail.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Microsoft Edge neural voices: no key, no account, no billing.
          # Google Cloud TTS is the better voice but Google Cloud India requires
          # a INR 1,000 prepayment before the free tier unlocks. To switch:
          # add GOOGLE_TTS_API_KEY as a secret and set TTS_PROVIDER to google.
          TTS_PROVIDER: edge
          EDGE_VOICE_NAME: ${{ secrets.EDGE_VOICE_NAME }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_VOICE_NAME: ${{ secrets.GOOGLE_VOICE_NAME }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CAPTIONS: '1'
          MUSIC: '1'
        run: python pipeline.py

      - name: Commit updated queue (marks the script as published)
        run: |
          git config user.name "auto-publisher"
          git config user.email "actions@github.com"
          git add scripts_queue.json
          git commit -m "Mark script as published" || echo "nothing to commit"
          git push
