name: Publish YouTube Video

on:
  schedule:
    # 2x/week (Tue + Fri, 10:00 UTC). Deliberately not 3x: at ~11.5k characters
    # per long-form script, 3x/week exceeds the ElevenLabs Creator allowance and
    # forces a jump from $22 to $99/month for no algorithmic benefit.
    - cron: '0 10 * * 2,5'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A ~17-minute video takes roughly 45 min to render on a 2-core runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        # fonts-dejavu is required for burned-in captions and the thumbnail.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Google Cloud TTS: 1,000,000 free characters/month against ~91k used
          # here. ElevenLabs Free is 10,000, which cannot finish one long video.
          TTS_PROVIDER: google
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_VOICE_NAME: ${{ secrets.GOOGLE_VOICE_NAME }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CAPTIONS: '1'
          MUSIC: '1'
        run: python pipeline.py

      - name: Commit updated queue (marks the script as published)
        run: |
          git config user.name "auto-publisher"
          git config user.email "actions@github.com"
          git add scripts_queue.json
          git commit -m "Mark script as published" || echo "nothing to commit"
          git push
